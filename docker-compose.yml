name: ai-buddy

services:
  agent:
    build:
      context: containers/Agent/
    environment:
      HTTP_PROXY: http://100.100.0.10:8080
      http_proxy: http://100.100.0.10:8080
      HTTPS_PROXY: http://100.100.0.10:8080
      https_proxy: http://100.100.0.10:8080
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
    volumes:
      - agent-home:/home/buddy
      - proxy-ca:/run/ai-buddy-ca:ro
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      agent-net:
    dns:
      - 100.100.0.10
    init: true
    security_opt:
      - no-new-privileges:true
    # Only the root phase of entrypoint.sh uses these: SETUID/SETGID for the
    # runuser drop to buddy, CHOWN/FOWNER/DAC_OVERRIDE for aligning buddy with
    # the workspace owner. Once runuser hands over, the non-root session holds
    # no capabilities and no-new-privileges keeps it from regaining them.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE

  proxy:
    build:
      context: containers/proxy/
    volumes:
      - proxy-config:/home/mitmproxy/.mitmproxy
      - proxy-ca:/home/mitmproxy/.mitmproxy-public
    networks:
      agent-net:
        ipv4_address: 100.100.0.10
      proxy-net:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cmp -s /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem
          /home/mitmproxy/.mitmproxy-public/ai-buddy-ca.crt &&
          python -c "import socket; [socket.create_connection(('127.0.0.1', port), 1).close() for port in (53, 8080)]"
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

networks:
  agent-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 100.100.0.0/24
  proxy-net:
    driver: bridge

volumes:
  agent-home:
  proxy-ca:
  proxy-config:
