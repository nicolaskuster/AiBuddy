name: ai-buddy

services:
  init-home:
    image: ai-buddy-agent
    user: root
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R "$$HOST_UID:$$HOST_GID" /home/buddy
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - agent-home:/home/buddy

  agent:
    image: ai-buddy-agent
    build:
      context: containers/Agent/
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /home/buddy
      DOCKER_HOST: tcp://docker-engine:2375
      TESTCONTAINERS_HOST_OVERRIDE: docker-engine
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /run/user/1000/docker.sock
    volumes:
      - agent-home:/home/buddy
    depends_on:
      init-home:
        condition: service_completed_successfully
      docker-engine:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  docker-engine:
    image: docker:dind-rootless
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker-data:/home/rootless/.local/share/docker
    healthcheck:
      test:
        - CMD
        - docker
        - --host=unix:///run/user/1000/docker.sock
        - info
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    init: true

volumes:
  agent-home:
  docker-data:
